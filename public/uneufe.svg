<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100" height="100">
  <!-- Hintergrund-Kreis für Spielelemente -->
  <circle cx="12" cy="12" r="10" fill="#F7FAFC" stroke="#4A5568" stroke-width="1.5"/>
  
  <!-- "6" für die Sechs oben -->
  <text x="12" y="7.5" font-family="Arial, sans-serif" font-weight="bold" font-size="5" text-anchor="middle" fill="#2D3748">6</text>
  
  <!-- "A" für As unten -->
  <text x="12" y="19.5" font-family="Arial, sans-serif" font-weight="bold" font-size="5" text-anchor="middle" fill="#718096">A</text>
  
  <!-- Dynamischer Pfeil nach oben -->
  <g stroke="#3182CE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="15" x2="12" y2="9.5"/>
    <polyline points="9.5 12 12 9.5 14.5 12"/>
  </g>
</svg>
