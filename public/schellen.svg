<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100" height="100">
  <!-- Aufhängung (Öse) -->
  <rect x="10" y="2" width="4" height="4" rx="1" fill="#F57F17" stroke="#E65100" stroke-width="1.5"/>
  <!-- Schellen-Körper -->
  <circle cx="12" cy="14" r="8" fill="#FFC107" stroke="#E65100" stroke-width="1.5"/>
  <!-- Mittleres Band (typisch für Jass-Schellen) -->
  <path d="M4.5 12H19.5" stroke="#E65100" stroke-width="1.5"/>
  <!-- Klangschlitz mit Loch am Ende -->
  <circle cx="12" cy="17" r="1.5" fill="#E65100"/>
  <path d="M8 17H16" stroke="#E65100" stroke-width="1.5" stroke-linecap="round"/>
</svg>
